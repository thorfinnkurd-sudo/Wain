

name: Build Wain Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "wain/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project files
        run: |
          test -f wain/settings.gradle.kts
          test -f wain/build.gradle.kts
          test -f wain/app/build.gradle.kts
          test -f wain/gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        working-directory: wain
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wain-debug-apk
          path: wain/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
